[project]
name = "payment-event-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hassan", email = "dewumi205@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
payment-event-platform = "payment_event_platform:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
